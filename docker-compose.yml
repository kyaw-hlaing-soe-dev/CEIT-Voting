version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ktuvoting-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkkkk11111}
      POSTGRES_DB: ktuvoting
      POSTGRES_INITDB_ARGS: --encoding=UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./MIGRATION_MULTI_FACTOR.sql:/docker-entrypoint-initdb.d/04-multi-factor.sql:ro
      - ./MIGRATION_COOKIE_BACKFILL.sql:/docker-entrypoint-initdb.d/03-cookie-backfill.sql:ro
      - ./MIGRATION_USER_AGENT.sql:/docker-entrypoint-initdb.d/02-user-agent.sql:ro
      - ./db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - voting-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ktuvoting"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=2000
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_buffers=32MB
      - -c
      - default_statistics_target=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - work_mem=8MB
      - -c
      - min_wal_size=2GB
      - -c
      - max_wal_size=8GB
  app:
    image: eclipse-temurin:21-jre-jammy
    container_name: ktuvoting-app
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:${PORT:-8080}"
    networks:
      - voting-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PORT:-8080}/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
volumes:
  postgres-data:
networks:
  voting-network:
