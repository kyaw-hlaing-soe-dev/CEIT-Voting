<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Admin Live Results — KTU Voting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/styles.css}" />

    <!-- Expose server-side voting pins to client JS. Values come from application.yml (voting.adminPin / voting.userPin) -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.KTUVoting = window.KTUVoting || {};
        window.KTUVoting.adminPin = "[[${@environment.getProperty('voting.adminPin')}]]";
        window.KTUVoting.userPin = "[[${@environment.getProperty('voting.userPin')}]]";
        /*]]>*/
    </script>

    <style>
        .thumbnail { width:44px; height:44px; object-fit:cover; border-radius:9999px; }
        .table-scroll { max-height:420px; overflow:auto; }
        .number-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0.5rem; }
        .number-pill { position:relative; }
        .number-pill input { position:absolute; inset:0; opacity:0; cursor:pointer; }
        .number-pill span { display:block; padding:0.5rem 0; border:1px solid #e5e7eb; border-radius:0.75rem; text-align:center; font-weight:600; color:#4b5563; background:#fff; transition:all 0.15s ease; }
        .number-pill input:checked + span { border-color:#4f46e5; background:#eef2ff; color:#312e81; box-shadow:0 0 0 1px #4f46e5 inset; }
        .number-pill input:disabled + span { opacity:0.3; cursor:not-allowed; }
        

        #live-category-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            width: 100%;
            box-sizing: border-box;
        }
        
        /* Tablet: 2 columns side by side */
        @media (min-width: 768px) {
            #live-category-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1.5rem;
            }
        }
        
        /* Desktop: Still 2 columns for optimal readability */
        @media (min-width: 1024px) {
            #live-category-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2rem;
            }
        }
        
        /* Large Desktop: Optional 3 columns if more space is needed */
        @media (min-width: 1536px) {
            #live-category-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 2rem;
            }
        }
        
        /* Ensure table cards have stable width and don't overflow */
        #live-category-grid > div {
            min-width: 0; /* Crucial: allows grid items to shrink below content size */
            box-sizing: border-box;
        }
        
        /* Table responsive behavior */
        #live-category-grid table {
            width: 100%;
            table-layout: fixed; /* Prevents tables from breaking layout */
            word-wrap: break-word;
        }
        
        /* Ensure scrollable container doesn't break grid */
        .table-scroll {
            overflow-x: auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch; /* Smooth scrolling on iOS */
        }
    </style>

</head>

<body class="bg-gray-50 text-gray-800">

<!-- Scripts: mocked fetch and UI logic -->
<script>
    // Plan: keep PIN gate, expose two views toggled by header buttons; mock /api/results and /api/candidates; implement Live Results (5 category top-5 tables) and Candidate Management CRUD with image preview and FormData logging.

    (function(){
        // Categories used by UI; expose whether mock mode is enabled below
        const CATEGORIES = ['KING','QUEEN','PRINCE','PRINCESS','COUPLE'];

        // Decide mock mode: default OFF. Enable by setting window.__USE_MOCK = true in the console or append ?mock=true to the URL.
        const USE_MOCK = (window.__USE_MOCK === true) || window.location.search.includes('mock=true');

        // If mock is disabled we keep native fetch (server-backed endpoints will be used).
        if (!USE_MOCK){
            return; // do not override fetch
        }

        // placeholder image (SVG Data URL)
        function placeholderImage(text, size=80){
            const t = encodeURIComponent((text||'Img').slice(0,12));
            const color = '1F2937';
            const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><rect width='100%' height='100%' rx='8' fill='%23${color}'/><text x='50%' y='54%' font-family='Helvetica, Arial' font-size='14' fill='white' text-anchor='middle' alignment-baseline='middle'>${t}</text></svg>`;
            return 'data:image/svg+xml;utf8,' + svg;
        }

        // Seed data (simulate GET responses)
        let mockCandidates = [
            { id:1, name:'Arthur King', department:'History', category:'KING', candidateNumber:1, votes:240, imageUrl: placeholderImage('Arthur') },
            { id:2, name:'Beatrice Queen', department:'Arts', category:'QUEEN', candidateNumber:1, votes:220, imageUrl: placeholderImage('Beatrice') },
            { id:3, name:'Cody Prince', department:'Engineering', category:'PRINCE', candidateNumber:1, votes:180, imageUrl: placeholderImage('Cody') },
            { id:4, name:'Diana Princess', department:'Science', category:'PRINCESS', candidateNumber:1, votes:205, imageUrl: placeholderImage('Diana') },
            { id:5, name:'Eva Couple', department:'Business', category:'COUPLE', candidateNumber:1, votes:150, imageUrl: placeholderImage('Eva') },
            { id:6, name:'Frank King', department:'Math', category:'KING', candidateNumber:2, votes:130, imageUrl: placeholderImage('Frank') },
            { id:7, name:'Gina Queen', department:'Design', category:'QUEEN', candidateNumber:2, votes:110, imageUrl: placeholderImage('Gina') },
            { id:8, name:'Hugo Prince', department:'Law', category:'PRINCE', candidateNumber:2, votes:95, imageUrl: placeholderImage('Hugo') },
            { id:9, name:'Iris Princess', department:'Medicine', category:'PRINCESS', candidateNumber:2, votes:87, imageUrl: placeholderImage('Iris') },
            { id:10, name:'Jay Couple', department:'Economics', category:'COUPLE', candidateNumber:2, votes:102, imageUrl: placeholderImage('Jay') }
        ];

        let nextId = mockCandidates.length + 1;

        // preserve native fetch
        const nativeFetch = window.fetch.bind(window);

        // helper to simulate delay
        const delay = ms => new Promise(res => setTimeout(res, ms));

        // helper to read File as DataURL
        function readFileAsDataURL(file){
            return new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.onerror = err => rej(err);
                r.readAsDataURL(file);
            });
        }

        // Mock fetch for our endpoints
        window.fetch = async function(input, init={}){
            const url = typeof input === 'string' ? input : input.url;
            const method = (init && init.method) ? init.method.toUpperCase() : (typeof input === 'object' && input.method ? input.method : 'GET');

            // GET /api/results
            if (url.endsWith('/api/results') && method === 'GET'){
                await delay(80);
                return { ok:true, status:200, json: async ()=> ({ results: mockCandidates.map(c=>({ id:c.id, name:c.name, department:c.department, category:c.category, votes:c.votes, imageUrl:c.imageUrl })) }) };
            }

            // GET /api/candidates
            if (url.endsWith('/api/candidates') && method === 'GET'){
                await delay(60);
                return { ok:true, status:200, json: async ()=> ({ candidates: mockCandidates.map(c=>({ ...c })) }) };
            }

            // POST /api/candidates
            if (url.endsWith('/api/candidates') && method === 'POST'){
                // try to get FormData
                let formData = null;
                if (init && init.body && typeof init.body.get === 'function') formData = init.body;
                else if (input instanceof Request){ try{ formData = await input.formData(); } catch(e){} }

                console.group('Mock POST /api/candidates - FormData');
                if (formData){ for (let pair of formData.entries()) console.log(pair[0], pair[1]); } else { console.log('No FormData'); }
                console.groupEnd();

                const candidate = { id: nextId++, name:'Unnamed', department:'', category: CATEGORIES[0], votes:0, imageUrl: placeholderImage('New') };
                if (formData){
                    candidate.name = formData.get('name') || candidate.name;
                    candidate.department = formData.get('department') || candidate.department;
                    candidate.category = formData.get('category') || candidate.category;
                    const num = formData.get('candidateNumber');
                    if (num) candidate.candidateNumber = parseInt(num,10);
                    const file = formData.get('image');
                    if (file && file.size){ candidate.imageUrl = await readFileAsDataURL(file); }
                }
                mockCandidates.push(candidate);
                await delay(120);
                return { ok:true, status:201, json: async ()=> ({ candidate }) };
            }

            // PUT /api/candidates/{id}
            if (url.match(/\/api\/candidates\/\d+$/) && method === 'PUT'){
                const id = parseInt(url.split('/').pop(),10);
                let formData = null;
                if (init && init.body && typeof init.body.get === 'function') formData = init.body;
                else if (input instanceof Request){ try{ formData = await input.formData(); } catch(e){} }

                console.group(`Mock PUT /api/candidates/${id}`);
                if (formData){ for (let pair of formData.entries()) console.log(pair[0], pair[1]); }
                console.groupEnd();

                const idx = mockCandidates.findIndex(c=>c.id===id);
                if (idx===-1) return { ok:false, status:404, json: async ()=> ({ error:'Not found' }) };
                const updated = { ...mockCandidates[idx] };
                if (formData){
                    updated.name = formData.get('name') || updated.name;
                    updated.department = formData.get('department') || updated.department;
                    updated.category = formData.get('category') || updated.category;
                    const num = formData.get('candidateNumber');
                    if (num) updated.candidateNumber = parseInt(num,10);
                    const file = formData.get('image');
                    if (file && file.size){ updated.imageUrl = await readFileAsDataURL(file); }
                }
                mockCandidates[idx] = updated;
                await delay(80);
                return { ok:true, status:200, json: async ()=> ({ candidate: updated }) };
            }

            // DELETE /api/candidates/{id}
            if (url.match(/\/api\/candidates\/\d+$/) && method === 'DELETE'){
                const id = parseInt(url.split('/').pop(),10);
                console.log('Mock DELETE candidate', id);
                const idx = mockCandidates.findIndex(c=>c.id===id);
                if (idx===-1) return { ok:false, status:404, json: async ()=> ({ error:'Not found' }) };
                mockCandidates.splice(idx,1);
                await delay(40);
                return { ok:true, status:200, json: async ()=> ({ success:true }) };
            }

            // Mock admin audit endpoint
            if (url.endsWith('/api/admin/audit') && method === 'GET'){
                await delay(40);
                const sample = [
                    { id:1, action:'RESET_ALL_VOTES', details:'Reset all candidate vote counts to 0. Rows affected: 12', performedBy:'admin', performedAt: new Date().toISOString() },
                    { id:2, action:'RESET_VOTES_BY_CATEGORY', details:'Reset votes for category KING. Rows affected: 3', performedBy:'alice', performedAt: new Date().toISOString() }
                ];
                return { ok:true, status:200, json: async ()=> sample };
            }

            // fallback
            return nativeFetch(input, init);
        };

        // Expose categories for UI
        window.__CATEGORIES = CATEGORIES;

    })();

    // UI code: PIN, navigation, rendering, and form handlers
    (function(){
        // Categories will be populated from window.__CATEGORIES (set by mock) or derived from server data
        let categories = (window.__CATEGORIES && Array.isArray(window.__CATEGORIES)) ? window.__CATEGORIES.slice() : [];

        // Elements
        const dashboard = document.getElementById('dashboard');

        const btnLive = document.getElementById('btn-live');
        const btnManage = document.getElementById('btn-manage');
        const manualRefreshBtn = document.getElementById('manualRefreshBtn');

        const viewLive = document.getElementById('view-live');
        const viewManage = document.getElementById('view-manage');

        const candidateForm = document.getElementById('candidate-form');
        const candidateIdInput = document.getElementById('candidate-id');
        const nameInput = document.getElementById('candidate-name');
        const categorySelect = document.getElementById('candidate-category');
        const deptInput = document.getElementById('candidate-dept');
        const imageInput = document.getElementById('candidate-image');
        const imagePreview = document.getElementById('image-preview');
        const imageFilename = document.getElementById('image-filename');
        const btnReset = document.getElementById('btn-reset');
        const candidatesTbody = document.getElementById('candidates-tbody');

        // Config
        // Use server-injected pins exposed via window.KTUVoting (set by Thymeleaf from application.yml)
        const ADMIN_PIN = (window.KTUVoting && window.KTUVoting.adminPin) ? String(window.KTUVoting.adminPin) : '88296'; // used for admin operations against /api/admin/*

        // init
        async function init(){
            // If categories aren't provided by the mock layer, derive them from the server-side results (/api/results/all)
            if (!categories || categories.length === 0){
                try{
                    const res = await fetch('/api/results/all', { credentials: 'same-origin', headers:{ 'Accept':'application/json' } });
                    if (res && res.ok){
                        const payload = await res.json();
                        // payload is an array of ResultDTO, each has a category field
                        const set = new Set();
                        (payload || []).forEach(r => { if (r && r.category) set.add(String(r.category)); });
                        categories = Array.from(set);
                        if (!categories.length) categories = ['KING','QUEEN','PRINCE','PRINCESS','COUPLE'];
                    } else {
                        categories = ['KING','QUEEN','PRINCE','PRINCESS','COUPLE'];
                    }
                } catch(e){
                    categories = ['KING','QUEEN','PRINCE','PRINCESS','COUPLE'];
                }
            }

            populateCategorySelect();
            attachEvents();
            // If a refresh requested the live view, honor it after attaching events
            try {
                const modeBadge = document.getElementById('modeBadge');
                const isMock = (window.__USE_MOCK === true) || window.location.search.includes('mock=true');
                if (modeBadge){
                    modeBadge.textContent = isMock ? 'Mock Mode' : 'Live Mode';
                    modeBadge.classList.toggle('bg-indigo-600', isMock);
                    modeBadge.classList.toggle('text-white', isMock);
                    modeBadge.classList.toggle('bg-gray-100', !isMock);
                    modeBadge.classList.toggle('text-gray-700', !isMock);
                }
            } catch(e){ /* ignore */ }

            // Immediately refresh and show the default view
            await refreshAll();
            // If a refresh requested the live view, show it; otherwise keep default (live)
            const forced = sessionStorage.getItem('adminOpenView');
            if (forced === 'live') {
                showView('live');
                sessionStorage.removeItem('adminOpenView');
            } else {
                // default to live
                showView('live');
            }
        }

        // cache of loaded candidates (flat list) to support edit flow
        let candidatesCache = [];

        function populateCategorySelect(){
            categorySelect.innerHTML = '';
            (categories || []).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; categorySelect.appendChild(o); });
        }

        function attachEvents(){
            btnLive.addEventListener('click', ()=> showView('live'));
            btnManage.addEventListener('click', ()=> showView('manage'));
            manualRefreshBtn.addEventListener('click', ()=> {
                // Force showing the Live Results page after reload
                try { sessionStorage.setItem('adminOpenView', 'live'); } catch(e) {}
                window.location.reload();
            });
            const btnResetVotes = document.getElementById('btn-reset-votes');
            if (btnResetVotes) btnResetVotes.addEventListener('click', onResetVotesClicked);
            const btnViewAudit = document.getElementById('btn-view-audit');
            if (btnViewAudit) btnViewAudit.addEventListener('click', onViewAuditClicked);
            imageInput.addEventListener('change', onImageChange);
            candidateForm.addEventListener('submit', onSubmitCandidate);
            btnReset.addEventListener('click', resetForm);
        }

        async function onViewAuditClicked(){
            try{
                const url = `/api/admin/audit?adminPin=${encodeURIComponent(ADMIN_PIN)}&limit=100`;
                const res = await fetch(url, { method: 'GET', credentials: 'same-origin' });
                if (!res.ok) throw new Error('Status ' + res.status);
                const audits = await res.json();
                showAuditModal(audits);
            } catch(err){
                console.error('Failed to load audit', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to load audit: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
            }
        }

        function showAuditModal(audits){
            // Remove existing modal if any
            const existing = document.getElementById('audit-modal');
            if (existing) existing.remove();

            const modal = document.createElement('div');
            modal.id = 'audit-modal';
            modal.style.position = 'fixed';
            modal.style.left = '0';
            modal.style.top = '0';
            modal.style.right = '0';
            modal.style.bottom = '0';
            modal.style.background = 'rgba(0,0,0,0.5)';
            modal.style.display = 'flex';
            modal.style.alignItems = 'center';
            modal.style.justifyContent = 'center';
            modal.innerHTML = `
                <div style="background:white; width:90%; max-width:900px; max-height:80%; overflow:auto; border-radius:8px; padding:16px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                        <h3 style="margin:0">Admin Audit</h3>
                        <button id="audit-close" style="padding:6px 10px;">Close</button>
                    </div>
                    <table style="width:100%; border-collapse:collapse; font-size:13px;">
                        <thead><tr style="text-align:left; border-bottom:1px solid #eee;"><th style="padding:6px">When</th><th style="padding:6px">Action</th><th style="padding:6px">Performed By</th><th style="padding:6px">Details</th></tr></thead>
                        <tbody>
                        ${ (audits || []).map(a => `<tr><td style="padding:6px;vertical-align:top">${new Date(a.performedAt).toLocaleString()}</td><td style="padding:6px;vertical-align:top">${a.action}</td><td style="padding:6px;vertical-align:top">${a.performedBy||''}</td><td style="padding:6px;vertical-align:top">${(a.details||'').replace(/</g,'&lt;')}</td></tr>`).join('') }
                        </tbody>
                    </table>
                </div>`;

            document.body.appendChild(modal);
            document.getElementById('audit-close').addEventListener('click', ()=> modal.remove());
        }

        // Reset votes
        async function onResetVotesClicked(){
            if (!confirm('Reset all candidate vote counts to 0? This action cannot be undone.')) return;
            try{
                // Prompt admin for optional category and performedBy (audit) values
                const categoryInput = prompt('Enter category to reset (KING, QUEEN, PRINCE, PRINCESS) or leave blank for ALL:');
                let category = (categoryInput || '').trim();
                if (category) category = category.toUpperCase();
                const allowed = ['KING','QUEEN','PRINCE','PRINCESS','COUPLE'];
                if (category && !allowed.includes(category)) {
                    alert('Invalid category: ' + category + '\nValid values: ' + allowed.join(', '));
                    return;
                }

                const performedByInput = prompt('Enter your name or identifier for audit (optional):');
                const performedBy = (performedByInput || '').trim();

                // Build URL with optional params
                let url = `/api/admin/candidates/reset-votes?adminPin=${encodeURIComponent(ADMIN_PIN)}`;
                if (category) url += `&category=${encodeURIComponent(category)}`;
                if (performedBy) url += `&performedBy=${encodeURIComponent(performedBy)}`;

                const res = await fetch(url, { method: 'POST', credentials: 'same-origin' });
                if (!res.ok) {
                    const text = await res.text().catch(()=>null);
                    throw new Error(text || ('Status ' + res.status));
                }
                const payload = await res.json();
                showToast(payload.message || 'Votes reset');

                // Immediately reflect reset totals in UI
                const totalVotersEl = document.querySelector('[data-total-voters]');
                const totalVotesEl = document.querySelector('[data-total-votes]');
                if (totalVotersEl) totalVotersEl.textContent = '0';
                if (totalVotesEl) totalVotesEl.textContent = '0';

                // Refresh dashboard views to pull fresh server data
                await refreshAll();
            } catch(err){
                console.error('Failed to reset votes', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to reset votes: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
            }
        }

        function showToast(msg='Saved', ms=1400){
            const t = document.createElement('div');
            t.textContent = msg; t.className = 'fixed right-6 bottom-6 bg-gray-900 text-white px-4 py-2 rounded shadow';
            document.body.appendChild(t);
            setTimeout(()=> t.remove(), ms);
        }


        // Image preview
        function onImageChange(e){
            const file = e.target.files && e.target.files[0];
            if (!file){ imagePreview.src = ''; imageFilename.textContent = ''; return; }
            imageFilename.textContent = file.name;
            const reader = new FileReader();
            reader.onload = ()=> imagePreview.src = reader.result;
            reader.readAsDataURL(file);
        }

        // Render Live Results: create 5 category tables showing Top 5 by votes
        async function renderLiveResults(){
            const container = document.getElementById('live-category-grid');
            container.innerHTML = '';
            try{
                const [statsRes, resultsRes] = await Promise.all([
                    fetch(`/api/admin/results?adminPin=${encodeURIComponent(ADMIN_PIN)}`, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } }),
                    fetch('/api/results/all', { credentials: 'same-origin', headers: { 'Accept': 'application/json' } })
                ]);
                if (!statsRes.ok) throw new Error('Stats status ' + statsRes.status);
                if (!resultsRes.ok) throw new Error('Results status ' + resultsRes.status);
                const statsPayload = await statsRes.json();
                const resultsPayload = await resultsRes.json();
                document.getElementById('fetchError').style.display = 'none';
                const stats = statsPayload && statsPayload.stats;
                const statsBar = document.getElementById('statsBar');
                if (statsBar && stats) {
                    statsBar.querySelector('[data-total-voters]').textContent = stats.totalVoters ?? 0;
                    statsBar.querySelector('[data-total-votes]').textContent = stats.totalVotes ?? 0;
                }
                const lastUpdatedEl = document.getElementById('lastUpdated');
                if (lastUpdatedEl) {
                    lastUpdatedEl.textContent = new Date().toLocaleTimeString();
                }
                const allResults = Array.isArray(resultsPayload) ? resultsPayload : [];

                 // build grouped map: category -> candidates array
                 const grouped = {};
                 (categories || []).forEach(c => grouped[c]=[]);
                allResults.forEach(result => {
                    const catKey = String(result.category);
                    const candList = Array.isArray(result.candidates) ? result.candidates : [];
                    grouped[catKey] = candList.map(ci => ({
                        id: ci.id,
                        name: ci.name,
                        department: ci.department || '',
                        votes: ci.voteCount || 0,
                        imageUrl: ci.imageUrl || ''
                    }));
                });

                 (categories || []).forEach(cat => {
                     const arr = (grouped[cat]||[]).slice().sort((a,b)=> b.votes - a.votes).slice(0,5);

                    // map category name to CSS class defined in styles.css
                    const catClassMap = {
                        'KING': 'category-king',
                        'QUEEN': 'category-queen',
                        'PRINCE': 'category-prince',
                        'PRINCESS': 'category-princess',
                        'COUPLE': 'category-couple'
                    };

                    const card = document.createElement('div');
                    // use category gradient background, keep rounded corners and prominent shadow to match main page
                    const bgClass = catClassMap[cat] || '';
                    card.className = `${bgClass} rounded-lg card-shadow p-4 text-white`;
                    const header = document.createElement('div');
                    header.className = 'flex items-center justify-between mb-3';
                    header.innerHTML = `<h4 class='font-semibold text-white'>${cat}</h4><div class='text-xs text-white/80'>Top ${arr.length}</div>`;
                    card.appendChild(header);

                    const table = document.createElement('table');
                    // on gradient background make table text lighter and remove heavy borders
                    table.className = 'min-w-full text-sm';
                    table.innerHTML = `<thead class='text-left text-xs text-white/80 uppercase'><tr><th class='py-1'>#</th><th class='py-1'>Candidate</th><th class='py-1'>Votes</th></tr></thead><tbody class='text-sm'></tbody>`;
                    const tb = table.querySelector('tbody');
                    arr.forEach((c, idx) => {
                        const tr = document.createElement('tr');
                        // lighter row styles on top of gradient
                        tr.className = (idx%2===0)?'bg-white/10':'bg-white/06';
                        tr.innerHTML = `<td class='py-2 pr-3 text-white/90'>${idx+1}</td><td class='py-2 pr-3 flex items-center gap-3 text-white'><img src='${c.imageUrl}' class='thumbnail' alt=''/><div><div class='font-medium text-white'>${c.name}</div><div class='text-xs text-white/80'>${c.department || ''}</div></div></td><td class='py-2 pr-3 font-semibold text-white'>${c.votes}</td>`;
                        tb.appendChild(tr);
                    });
                    card.appendChild(table);
                    container.appendChild(card);
                });

                viewLive.classList.remove('hidden');
                viewManage.classList.add('hidden');
            } catch(err){
                console.error('Failed to fetch /api/results', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to load results from server: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
            }
        }

        // Render Candidates list in management view
        async function renderCandidatesList(){
            candidatesTbody.innerHTML = '';
            try{
                // fetch candidates per category and aggregate
                const fetches = (categories || []).map(cat => fetch(`/api/candidates/${encodeURIComponent(cat)}`, { credentials: 'same-origin', headers: { 'Accept': 'application/json' } }).then(r => {
                    if (!r.ok) throw new Error(`Status ${r.status} for category ${cat}`);
                    return r.json();
                }).then(arr => ({ category: cat, list: Array.isArray(arr) ? arr : (arr.candidates || []) })));

                const results = await Promise.all(fetches);
                const flat = [];
                results.forEach(res => {
                    const list = res.list || [];
                    list.forEach(c => {
                        flat.push({ id: c.id, name: c.name, category: res.category, department: c.department || '', candidateNumber: c.candidateNumber || c.number || null, votes: c.voteCount || c.votes || 0, imageUrl: c.imageUrl || '' });
                    });
                });

                // cache for edit operations
                candidatesCache = flat;
                document.getElementById('fetchError').style.display = 'none';

                flat.forEach((c, i) => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class='px-4 py-3'>${i+1}</td>
                        <td class='px-4 py-3 font-medium'>${c.candidateNumber || ''}</td>
                        <td class='px-4 py-3 flex items-center gap-3'><img src='${c.imageUrl || ''}' class='thumbnail' alt=''/><div><div class='font-medium'>${c.name}</div><div class='text-xs text-gray-500'>ID ${c.id}</div></div></td>
                        <td class='px-4 py-3'>${c.category}</td>
                        <td class='px-4 py-3'>${c.department || ''}</td>
                        <td class='px-4 py-3'>${c.votes}</td>
                        <td class='px-4 py-3'><div class='flex gap-2'><button data-id='${c.id}' class='edit-btn px-3 py-1 rounded border bg-white text-sm'>Edit</button><button data-id='${c.id}' class='del-btn px-3 py-1 rounded border bg-red-50 text-red-600 text-sm'>Delete</button></div></td>
                    `;
                    candidatesTbody.appendChild(tr);
                });

            } catch(err){
                console.error('Failed to fetch /api/candidates by category', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to load candidates from server: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
                return;
            }

            document.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', onEditCandidate));
            document.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', onDeleteCandidate));

            viewManage.classList.remove('hidden');
            viewLive.classList.add('hidden');
        }

        // Refresh both views
        async function refreshAll(){
            await renderLiveResults();
            await renderCandidatesList();
        }

        // Edit candidate: populate form
        async function onEditCandidate(e){
            const id = parseInt(e.currentTarget.dataset.id,10);
            // find candidate in local cache populated by renderCandidatesList
            const c = (candidatesCache || []).find(x => String(x.id) === String(id));
            if (!c) return alert('Candidate not found');
            candidateIdInput.value = c.id;
            nameInput.value = c.name;
            categorySelect.value = c.category;
            deptInput.value = c.department || '';
            imagePreview.src = c.imageUrl || '';
            // set hidden imageUrl so backend knows existing image when no new file uploaded
            document.getElementById('candidate-image-url').value = c.imageUrl || '';
            imageFilename.textContent = '';
            // set candidate number when editing
            setSelectedNumber(c.candidateNumber ?? null);
            showView('manage');
         }

        // Delete candidate
        async function onDeleteCandidate(e){
            const id = parseInt(e.currentTarget.dataset.id,10);
            if (!confirm('Delete candidate #' + id + '?')) return;
            try{
                if (window.__USE_MOCK === true || window.location.search.includes('mock=true')){
                    // mock backend
                    const res = await fetch(`/api/candidates/${id}`, { method: 'DELETE', credentials: 'same-origin', headers: { 'Accept': 'application/json' } });
                    if (!res.ok) throw new Error('Status ' + res.status);
                    const payload = await res.json();
                    if (payload && payload.success){
                        showToast('Deleted');
                        await refreshAll();
                    } else {
                        alert('Delete failed');
                    }
                } else {
                    // real backend: call admin endpoint with adminPin and expect 204 No Content
                    const res = await fetch(`/api/admin/candidates/${id}?adminPin=${encodeURIComponent(ADMIN_PIN)}`, { method: 'DELETE', credentials: 'same-origin' });
                    if (res.status === 204 || res.ok) {
                        showToast('Deleted');
                        await refreshAll();
                    } else {
                        const body = await res.text().catch(()=>null);
                        throw new Error('Status ' + res.status + (body ? (': ' + body) : ''));
                    }
                }
            } catch(err){
                console.error('Failed to delete candidate', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to delete candidate: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
            }
        }

        // Reset form
        function resetForm(){
            candidateIdInput.value = '';
            nameInput.value = '';
            categorySelect.value = categories[0];
            deptInput.value = '';
            setSelectedNumber(null);
            imageInput.value = '';
            imagePreview.src = '';
            imageFilename.textContent = '';
        }

        // Number selector helpers
        const numberSelector = document.getElementById('numberSelector');
        const numberValidation = document.getElementById('numberValidation');
        const saveButton = document.getElementById('btn-save');

        // build number pills 1..9
        function buildNumberSelector(){
            if (!numberSelector) return;
            numberSelector.innerHTML = '';
            for (let i=1;i<=10;i++){
                const id = 'num-'+i;
                const wrapper = document.createElement('label');
                wrapper.className = 'number-pill';
                wrapper.innerHTML = `<input type="radio" name="candidate-number" value="${i}" id="${id}"><span>${i}</span>`;
                numberSelector.appendChild(wrapper);
            }
            // attach change handler
            numberSelector.querySelectorAll('input[name="candidate-number"]').forEach(r => r.addEventListener('change', onNumberChange));
        }

        function onNumberChange(){
            // client-side: ensure same category doesn't already have this number
            const selected = getSelectedNumber();
            const curId = candidateIdInput.value ? String(candidateIdInput.value) : null;
            const cat = categorySelect.value;
            let conflict = false;
            if (selected && categories){
                for (const c of candidatesCache || []){
                    if (!c || !c.id) continue;
                    if (String(c.category) === String(cat) && String(c.candidateNumber) === String(selected) && String(c.id) !== String(curId)){
                        conflict = true; break;
                    }
                }
            }
            if (conflict){
                numberValidation.style.display = '';
                numberValidation.textContent = 'Another candidate in this category is already using this number.';
                saveButton.disabled = true;
            } else {
                numberValidation.style.display = 'none';
                numberValidation.textContent = '';
                saveButton.disabled = false;
            }
        }

        function setSelectedNumber(num){
            if (!numberSelector) return;
            const radios = numberSelector.querySelectorAll('input[name="candidate-number"]');
            radios.forEach(r => { r.checked = false; });
            if (num == null) return;
            const target = numberSelector.querySelector(`input[value='${num}']`);
            if (target) target.checked = true;
            // trigger validation
            onNumberChange();
        }

        function getSelectedNumber(){
            if (!numberSelector) return null;
            const sel = numberSelector.querySelector('input[name="candidate-number"]:checked');
            return sel ? parseInt(sel.value,10) : null;
        }

        // build selector early
        buildNumberSelector();

        // Submit create/update
         async function onSubmitCandidate(ev){
             ev.preventDefault();
             const id = candidateIdInput.value ? parseInt(candidateIdInput.value,10) : null;
             // ensure candidate number selected
             const selNum = getSelectedNumber();
             if (selNum == null){
                 numberValidation.style.display = '';
                 numberValidation.textContent = 'Candidate number is required (1–10).';
                 return;
             }
             const formData = new FormData();
             formData.append('name', nameInput.value.trim());
             formData.append('department', deptInput.value.trim());
             formData.append('category', categorySelect.value);
             // include candidateNumber if selected
             if (selNum != null) formData.append('candidateNumber', String(selNum));
            if (imageInput.files && imageInput.files[0]) {
                formData.append('image', imageInput.files[0]);
            } else {
                // preserve existing imageUrl when editing and no new file chosen
                const existingUrl = document.getElementById('candidate-image-url').value;
                if (existingUrl) formData.append('imageUrl', existingUrl);
            }

             console.group('FormData');
             for (let pair of formData.entries()) console.log(pair[0], pair[1]);
             console.groupEnd();

             try{
                // No rank validation in admin UI — backend still accepts candidateNumber if provided, but admin will not send it from the UI.

                 // If mock mode is active we still use the mock endpoints (FormData). Otherwise call admin endpoints with JSON and adminPin.
                if (window.__USE_MOCK === true || window.location.search.includes('mock=true')){
                    if (id){
                        const res = await fetch(`/api/candidates/${id}`, { method: 'PUT', body: formData, credentials: 'same-origin' });
                        if (!res.ok) throw new Error('Status ' + res.status);
                        const payload = await res.json();
                        console.log('PUT response', payload);
                        showToast('Updated');
                    } else {
                        const res = await fetch('/api/candidates', { method: 'POST', body: formData, credentials: 'same-origin' });
                        if (!res.ok) throw new Error('Status ' + res.status);
                        const payload = await res.json();
                        console.log('POST response', payload);
                        showToast('Created');
                    }
                } else {
                    // Real backend: send multipart/form-data to admin endpoints. The form is encoded automatically by the browser when using FormData.
                    const adminPin = ADMIN_PIN;
                    if (id){
                        const res = await fetch(`/api/admin/candidates/${id}?adminPin=${encodeURIComponent(adminPin)}`, { method: 'PUT', body: formData, credentials: 'same-origin' });
                        if (!res.ok) {
                            const text = await res.text().catch(()=>null);
                            throw new Error(text || ('Status ' + res.status));
                        }
                        const payload = await res.json();
                        console.log('Admin PUT response', payload);
                        showToast('Updated');
                    } else {
                        const res = await fetch(`/api/admin/candidates?adminPin=${encodeURIComponent(adminPin)}`, { method: 'POST', body: formData, credentials: 'same-origin' });
                        if (!res.ok) {
                            const text = await res.text().catch(()=>null);
                            throw new Error(text || ('Status ' + res.status));
                        }
                        const payload = await res.json();
                        console.log('Admin POST response', payload);
                        showToast('Created');
                    }
                }
                document.getElementById('fetchError').style.display = 'none';
            } catch(err){
                console.error('Failed to submit candidate', err);
                const fe = document.getElementById('fetchError');
                fe.textContent = 'Failed to save candidate: ' + (err && err.message ? err.message : err);
                fe.style.display = '';
            }

            resetForm();
            await refreshAll();
        }

        // Helper to show specific view and update nav button styles
        function showView(v){
            if (v === 'live'){
                btnLive.classList.add('bg-white'); btnLive.classList.remove('bg-indigo-600','text-white');
                btnManage.classList.add('bg-indigo-600','text-white'); btnManage.classList.remove('bg-white');
                viewLive.classList.remove('hidden'); viewManage.classList.add('hidden');
            } else {
                btnManage.classList.add('bg-indigo-600','text-white'); btnManage.classList.remove('bg-white');
                btnLive.classList.remove('bg-indigo-600','text-white'); btnLive.classList.add('bg-white');
                viewManage.classList.remove('hidden'); viewLive.classList.add('hidden');
            }
        }

        // initialize
        init();

    })();

</script>

</body>
