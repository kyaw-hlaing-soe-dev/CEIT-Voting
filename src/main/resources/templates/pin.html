<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Enter PIN - CEIT Voting Event</title>
    <meta name="api-base" content="/api">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/images/logo.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/images/logo.png}">
    <link rel="shortcut icon" th:href="@{/images/logo.png}">

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" th:href="@{/styles.css}">

    <script th:inline="javascript">
        /*<![CDATA[*/
        window.KTUVoting = window.KTUVoting || {};
        var __adminPin = "[[${@environment.getProperty('voting.admin-pin')}]]";
        if (!__adminPin || __adminPin === 'null') __adminPin = "[[${@environment.getProperty('voting.adminPin')}]]";
        window.KTUVoting.adminPin = String(__adminPin || '').trim();
        /*]]>*/
    </script>

    <style>
        .pin-input {
            width: 44px;
            height: 44px;
            text-align: center;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            font-size: 20px;
        }

        .pin-input--active {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .keypad-key {
            transform: scale(1);
            transition: transform .12s ease;
        }

        .keypad-pressed {
            transform: scale(0.94);
        }

        .skeleton {
            background-color: #e5e7eb;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .skeleton-text {
            height: 14px;
            border-radius: 7px;
        }

        .skeleton-rounded {
            border-radius: 9999px;
        }

        .skeleton-tile {
            border-radius: 12px;
            height: 44px;
        }

        .hidden {
            display: none;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.55;
            }

            100% {
                opacity: 1;
            }
        }
    </style>

</head>

<body class="bg-gray-50">

<!-- PIN Screen -->

<div class="min-h-screen gradient-bg flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-6 md:p-12 max-w-md w-full card-shadow slide-in">

        <div class="text-center mb-6 md:mb-8">

            <div class="w-16 h-16 md:w-20 md:h-20 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">

                <svg class="w-8 h-8 md:w-10 md:h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>

                </svg>

            </div>

            <h3 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">Enter Your PIN</h3>

            <p class="text-sm md:text-base text-gray-600">Please enter your 7-digit PIN to continue</p>

        </div>


        <div class="flex justify-center gap-3 md:gap-4 mb-6 md:mb-8">
            <input type="password" maxlength="1" class="pin-input" id="pin1" readonly aria-label="PIN digit 1">
            <input type="password" maxlength="1" class="pin-input" id="pin2" readonly aria-label="PIN digit 2">
            <input type="password" maxlength="1" class="pin-input" id="pin3" readonly aria-label="PIN digit 3">
            <input type="password" maxlength="1" class="pin-input" id="pin4" readonly aria-label="PIN digit 4">
            <input type="password" maxlength="1" class="pin-input" id="pin5" readonly aria-label="PIN digit 5">
            <input type="password" maxlength="1" class="pin-input" id="pin6" readonly aria-label="PIN digit 6">
            <input type="password" maxlength="1" class="pin-input" id="pin7" readonly aria-label="PIN digit 7">
        </div>



        <div class="grid grid-cols-3 gap-2 md:gap-3 mb-4" id="pin-keypad">

            <button data-digit="1" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">1</button>

            <button data-digit="2" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">2</button>

            <button data-digit="3" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">3</button>

            <button data-digit="4" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">4</button>

            <button data-digit="5" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">5</button>

            <button data-digit="6" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">6</button>

            <button data-digit="7" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">7</button>

            <button data-digit="8" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">8</button>

            <button data-digit="9" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">9</button>

            <button id="clear-key" class="bg-red-100 hover:bg-red-200 text-red-600 font-semibold py-3 md:py-4 rounded-xl transition text-sm md:text-base">Clear</button>

            <button data-digit="0" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition">0</button>

            <button id="delete-key" class="keypad-key bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-3 md:py-4 rounded-xl transition" aria-label="Delete digit">←</button>

        </div>



        <button type="button" onclick="handleContinue()" class="w-full gradient-bg text-white py-3 md:py-4 rounded-xl font-semibold hover:opacity-90 transition">

            Continue

        </button>

    </div>

</div>



<!-- Error Modal -->

<div id="error-modal" class="hidden fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">

    <div class="bg-white rounded-3xl p-8 max-w-md w-full card-shadow slide-in">

        <div class="text-center">

            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">

                <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>

                </svg>

            </div>

            <h3 class="text-2xl font-bold text-gray-800 mb-4" id="error-title">Unable to continue</h3>

            <p class="text-gray-600 mb-6" id="error-message">The PIN you entered is incorrect. Please try again.</p>


            <button data-close-modal="error-modal" class="w-full gradient-bg text-white py-3 rounded-xl font-semibold hover:opacity-90 transition">

                Try Again

            </button>

        </div>

    </div>

</div>



<div class="absolute inset-0 flex items-center justify-center bg-white bg-opacity-90 hidden" id="pin-loading" aria-hidden="true">
    <div class="space-y-4 w-full max-w-xs">
        <div class="skeleton skeleton-rounded h-16 w-16 mx-auto"></div>
        <div class="skeleton skeleton-text w-3/4 mx-auto"></div>
        <div class="grid grid-cols-3 gap-3">
            <div class="skeleton skeleton-tile"></div>
            <div class="skeleton skeleton-tile"></div>
            <div class="skeleton skeleton-tile"></div>
        </div>

    </div>
</div>

<script src="/js/voting.js"></script>
<script>
    const pinInputs = ['pin1', 'pin2', 'pin3', 'pin4', 'pin5', 'pin6', 'pin7'].map(id => document.getElementById(id));
    const pinLoadingOverlay = document.getElementById('pin-loading');

    // Web Audio API for keypad sound
    let audioContext = null;
    function getAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        return audioContext;
    }

    function playKeypadFeedback(btn) {
        if (btn) {
            btn.classList.add('keypad-pressed');
            setTimeout(() => btn.classList.remove('keypad-pressed'), 120);
        }
        try {
            const ctx = getAudioContext();
            const oscillator = ctx.createOscillator();
            const gainNode = ctx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(ctx.destination);
            oscillator.frequency.value = 1200;
            oscillator.type = 'sine';
            gainNode.gain.setValueAtTime(0.1, ctx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            oscillator.start(ctx.currentTime);
            oscillator.stop(ctx.currentTime + 0.08);
        } catch (e) {}
    }

    function setActiveInput(target) {
        pinInputs.forEach((input) => input.classList.toggle('pin-input--active', input === target));
    }

    function firstEmpty() {
        return pinInputs.find(input => input.value === '') || pinInputs[pinInputs.length - 1];
    }

    function getEnteredPin() {
        return pinInputs.map(i => i.value).join('');
    }

    // debounce to prevent double-entry on some browsers (ignore events within 300ms)
    let _lastKeyPressAt = 0;
    function addPin(btn, digit) {
        const now = Date.now();
        if (now - _lastKeyPressAt < 300) return;
        _lastKeyPressAt = now;
        // btn is the button DOM element passed from the onclick handler
        playKeypadFeedback(btn);
        const target = firstEmpty();
        if (!target) return;
        target.value = digit;
        setActiveInput(target);
        if (pinInputs.every(i => i.value !== '')) handleContinue();
    }

    function deletePin(btn) {
        const now = Date.now();
        if (now - _lastKeyPressAt < 300) return; _lastKeyPressAt = now;
        playKeypadFeedback(btn);
        for (let i = pinInputs.length - 1; i >= 0; i--) {
            if (pinInputs[i].value !== '') {
                pinInputs[i].value = '';
                setActiveInput(pinInputs[i]);
                break;
            }
        }
    }

    function clearPin(btn) {
        const now = Date.now();
        if (now - _lastKeyPressAt < 300) return; _lastKeyPressAt = now;
        playKeypadFeedback(btn);
        pinInputs.forEach(i => i.value = '');
        setActiveInput(pinInputs[0]);
    }

    function showError(message, title = 'Unable to continue') {
        document.getElementById('error-title').textContent = title;
        document.getElementById('error-message').textContent = message;
        document.getElementById('error-modal').classList.remove('hidden');
        clearPin();
    }

    document.querySelectorAll('[data-close-modal]').forEach(btn => btn.addEventListener('click', () => {
        const id = btn.getAttribute('data-close-modal');
        const modal = document.getElementById(id);
        if (modal) modal.classList.add('hidden');
    }));

    async function handleContinue() {
         const pin = getEnteredPin();

         // Try server-side admin validation first. If valid, redirect to admin dashboard.
         try {
             const apiBase = (window.VotingApp && window.VotingApp.API_BASE) ? window.VotingApp.API_BASE : (document.querySelector('meta[name="api-base"]')?.content || '/api');
             const normalizedBase = apiBase.endsWith('/') ? apiBase.slice(0, -1) : apiBase;
             const validateRes = await fetch(`${normalizedBase}/admin/validate?adminPin=${encodeURIComponent(pin)}`, { method: 'GET', credentials: 'same-origin' });
             // Log status and body for debugging admin validation failures
             try {
                 const clone = validateRes.clone();
                 const bodyText = await clone.text().catch(() => '');
                 console.debug('admin/validate response', validateRes.status, bodyText);
             } catch (ld) { console.debug('Failed to read validate response body', ld); }
             if (validateRes.ok) {
                 const json = await validateRes.json().catch(() => ({}));
                 if (json && (json.valid || json.authenticated)) {
                     console.info('Server validated admin PIN, redirecting to /admin-dashboard');
                     // Server validated — ensure session cookie is active by checking /api/admin/session
                     const maxRetries = 5;
                     for (let attempt = 0; attempt < maxRetries; attempt++) {
                         try {
                             const sres = await fetch('/api/admin/session', { method: 'GET', credentials: 'same-origin' });
                             if (sres.ok) {
                                 const sj = await sres.json().catch(() => ({}));
                                 if (sj && sj.authenticated) {
                                     window.location.assign('/admin-dashboard');
                                     return;
                                 }
                             }
                         } catch (e) {
                             console.debug('session check failed', e);
                         }
                         // small backoff
                         await new Promise(r => setTimeout(r, 180));
                     }
                     // fallback: navigate anyway
                     window.location.assign('/admin-dashboard');
                      return;
                 }
             } else {
                 // show server reason to user for easier debugging
                 let serverMsg = '';
                 try { serverMsg = await validateRes.text(); } catch(e) { serverMsg = String(e); }
                 console.warn('Admin validate failed', validateRes.status, serverMsg);
                 // show modal with server reply (safe escaped text)
                 showError('Admin validation failed (HTTP ' + validateRes.status + '). ' + (serverMsg ? serverMsg : ''), 'Admin validation failed');
                 return;
             }
         } catch (e) {
             // If validation fails due to network or 403, continue to normal voter flow
             console.debug('Admin validate call failed or returned 403; continuing voter flow', e);
         }

        // Check admin PIN first (client-side fallback): allow admin access regardless of entered length (support shorter configured adminPin)
        const ADMIN_PIN = (window.KTUVoting && window.KTUVoting.adminPin) ? String(window.KTUVoting.adminPin).trim() : null;
        console.debug('handleContinue: enteredPin=', pin, ' ADMIN_PIN=', ADMIN_PIN);
        if (ADMIN_PIN) {
            const adminPinStr = String(ADMIN_PIN);
            const exactMatch = pin === adminPinStr;
            const pinEndsWithAdmin = pin && adminPinStr && pin.endsWith && pin.endsWith(adminPinStr);
            const adminEndsWithPin = pin && adminPinStr && adminPinStr.endsWith && adminPinStr.endsWith(pin);
            if (exactMatch || pinEndsWithAdmin || adminEndsWithPin) {
                console.info('Admin PIN matched (client fallback), redirecting to /admin-dashboard');
                window.location.assign('/admin-dashboard');
                return;
            }
        }

        if (pin.length !== 7) {
            showError('Please enter your 7-digit PIN.');
            return;
        }

        if (typeof VotingApp === 'undefined') {
            showError('Application not loaded properly. Please refresh the page.');
            return;
        }

        pinLoadingOverlay.classList.remove('hidden');
        try {
            const result = await VotingApp.verifyPin(pin);
            if (!result.valid) {
                const message = result.message || 'The PIN you entered does not exist or is already used. Please try again.';
                showError(message, 'Invalid PIN');
                return;
            }
            VotingApp.savePin(pin);
            window.location.assign('/king-selection');
        } catch (err) {
            console.error('Error during verifyPin:', err);
            showError(err.message || 'Something went wrong while verifying your PIN.');
        } finally {
            pinLoadingOverlay.classList.add('hidden');
            window.scrollTo(0, 0);
        }
    }

    // Disable legacy device status check
    async function checkDeviceStatus() { return; }

    document.addEventListener('DOMContentLoaded', () => {
    pinInputs.forEach((input, idx) => {
        input.dataset.index = idx;
        input.addEventListener('focus', () => input.blur());
    });
    setActiveInput(pinInputs[0]);
    setTimeout(() => window.scrollTo(0, 0), 0);

    // Browser Lock: if this browser was already used, hide keypad and show message
    try {
        if (window.VotingApp && typeof window.VotingApp.hasVoted === 'function' && window.VotingApp.hasVoted()) {
            // Hide keypad and inputs
            const keypad = document.getElementById('pin-keypad');
            if (keypad) keypad.classList.add('hidden');
            pinInputs.forEach(i => { i.value = ''; i.disabled = true; });
            // Show friendly already-voted message
            const overlay = document.createElement('div');
            overlay.className = 'bg-white rounded-3xl p-6 md:p-12 max-w-md w-full card-shadow text-center';
            overlay.innerHTML = '<h3 class="text-2xl font-bold text-gray-800 mb-2">You have already cast your vote</h3><p class="text-gray-600 mb-4">Thank you — multiple submissions are not allowed from the same device.</p>';
            const parent = document.querySelector('.min-h-screen .max-w-md') || document.querySelector('.min-h-screen');
            if (parent) {
                parent.innerHTML = '';
                parent.appendChild(overlay);
            } else {
                document.body.prepend(overlay);
            }
        }
    } catch (e) { console.debug('hasVoted check failed', e); }

    // If ?debugClearVoted=true is present in URL and an adminPin matches, enable a hidden reset button for testing
    try {
        const url = new URL(window.location.href);
        if (url.searchParams.get('debugClearVoted') === 'true') {
            const btn = document.createElement('button');
            btn.textContent = 'Reset voted flag (debug)';
            btn.className = 'mt-4 px-3 py-2 rounded bg-yellow-100 border border-yellow-300';
            btn.addEventListener('click', () => {
                try { window.VotingApp.clearVotedFlag(); alert('Cleared voted flag'); } catch (e) { alert('Failed to clear voted flag'); }
            });
            const container = document.querySelector('.max-w-md');
            if (container) container.appendChild(btn);
        }
    } catch (e) { console.debug('debugClearVoted check failed', e); }

            // Attach pointer/click handlers to keypad buttons to ensure responsiveness on touch devices
    try {
        const keypad = document.getElementById('pin-keypad');
        if (keypad) {
            keypad.querySelectorAll('button').forEach(btn => {
                if (btn.dataset._keypadAttached) return;
                const txt = (btn.textContent || '').trim();

                // pointerdown: primary handler for fast touch/click response
                const onPointer = (e) => {
                    try { e.preventDefault(); } catch (pe) {}
                    // record timestamp so click fallback knows this was handled
                    btn.dataset._handledAt = String(Date.now());
                    if (txt === 'Clear') return clearPin(btn);
                    if (txt === '←' || txt === '\u2190') return deletePin(btn);
                    if (/^\d$/.test(txt)) return addPin(btn, txt);
                };
                btn.addEventListener('pointerdown', onPointer);

                // click fallback: only invoke if pointerdown did not just handle it
                btn.addEventListener('click', (e) => {
                    try { e.preventDefault(); } catch (ce) {}
                    const last = parseInt(btn.dataset._handledAt || '0', 10);
                    const now = Date.now();
                    if (now - last < 500) return; // pointerdown already handled
                    // fallback for environments without pointer events
                    if (txt === 'Clear') return clearPin(btn);
                    if (txt === '←' || txt === '\u2190') return deletePin(btn);
                    if (/^\d$/.test(txt)) return addPin(btn, txt);
                }, { passive: false });

                // Remove any inline onclick to avoid duplicate handlers
                try { if (btn.getAttribute && btn.getAttribute('onclick')) btn.removeAttribute('onclick'); } catch (rmE) { /* ignore */ }

                btn.dataset._keypadAttached = '1';
            });
        }
    } catch (e) { console.debug('attachKeypadListeners failed', e); }

    checkDeviceStatus();
    });
</script>

</body>

</html>
